spring.application.name=brahmaputra-hostel

# Default In-Memory H2 Database (Zero-setup demo)
spring.datasource.url=jdbc:h2:mem:hosteldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Optional PostgreSQL configuration (Uncomment when connecting to local PostgreSQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/brahmaputra_hostel
# spring.datasource.username=mysha_11
# spring.datasource.password=mysha@postgresql26

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initial Data Load
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080

app.jwt.expiry-hours=24
app.jwt.secret=my-very-secure-secret-key-that-is-at-least-256-bits-long-for-hs256
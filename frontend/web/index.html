<head>

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->

  <!-- Google Identity Services (OAuth 2.0 / Sign In with Google) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.googleClientId = "318616334957-3erbcd2rp1ui5ekqvsis28hoiufo7ier.apps.googleusercontent.com";

    window.launchGoogleSignIn = function() {
      return new Promise(function(resolve, reject) {
        if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
          reject(new Error("Google Identity Services is loading. Please check your internet connection or try again."));
          return;
        }

        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: window.googleClientId,
            scope: 'openid email profile',
            hd: 'smail.iitm.ac.in',
            prompt: 'select_account',
            callback: function(tokenResponse) {
              if (tokenResponse.error) {
                reject(new Error(tokenResponse.error_description || tokenResponse.error));
                return;
              }

              // Fetch verified profile from Google's userinfo endpoint
              fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { 'Authorization': 'Bearer ' + tokenResponse.access_token }
              })
              .then(function(res) {
                if (!res.ok) {
                  throw new Error("Failed to fetch Google profile information");
                }
                return res.json();
              })
              .then(function(profile) {
                resolve(JSON.stringify({
                  idToken: tokenResponse.access_token,
                  email: profile.email,
                  name: profile.name,
                  picture: profile.picture,
                  hd: profile.hd
                }));
              })
              .catch(function(err) {
                reject(err);
              });
            }
          });

          client.requestAccessToken({ prompt: 'select_account' });
        } catch (err) {
          reject(err);
        }
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
